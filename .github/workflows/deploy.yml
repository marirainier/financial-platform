name: Deploy Fabric Workspace

on:
  push:
    branches: [ main ]

# Required permission to request the OIDC token from GitHub
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Authenticate securely to Azure via Workload Identity Federation (OIDC)
      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Fabric Orchestrator
        # Uses DefaultAzureCredential which automatically picks up OIDC token from azure/login
        run: |
          python infrastructure/fabric_orchestrator.py \
            --workspace-name "FinancialRevenuePlatform" \
            --git-provider GitHub \
            --git-repo "${{ github.repository }}" \
            --git-branch "${{ github.ref_name }}" \
            --git-directory "fabric" \
            --git-pat "${{ secrets.GIT_PAT }}"
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric_financial_revenue_platform"
version = "0.1.0"
description = "Code-first Microsoft Fabric Modern Data Platform for Financial Revenue Projections"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.4.0",
    "pandas>=2.0.0",
    "delta-spark>=2.4.0",
    "pyyaml>=6.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
